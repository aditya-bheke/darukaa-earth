name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    env:
      LLM_PROVIDER: none        # CI is deterministic and needs no secrets
      GEO_ENABLED: "false"
      FASTEMBED_CACHE_PATH: ~/.cache/fastembed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/fastembed
          key: fastembed-bge-small-en-v1.5
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Build & validate knowledge base
        run: python -m darukaa.kb.build
      - name: Unit & integration tests
        run: pytest
      - name: Behavioural evaluation (11 scenarios)
        run: python eval/run_eval.py --no-llm

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image (builds and validates the knowledge base inside)
        run: docker build -t darukaa-earth .
      - name: Smoke-test the REST API
        run: |
          docker run -d --name api -p 8000:8000 -e LLM_PROVIDER=none -e GEO_ENABLED=false darukaa-earth \
            uvicorn api:app --host 0.0.0.0 --port 8000
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 2; done
          curl -sf -X POST http://localhost:8000/chat -H 'Content-Type: application/json' \
            -d '{"site": {"soil_organic_carbon": "0.3%", "rainfall": "low", "crop": "monoculture wheat", "region": "semi-arid"}}' \
            | python -c "import sys, json; r = json.load(sys.stdin)['response']; assert r['type'] == 'recommendations' and r['action_plan'], r; print('API OK')"
