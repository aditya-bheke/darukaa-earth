[project]
name = "darukaa-earth"
version = "0.1.0"
description = "Knowledge-grounded AI environmental scientist for biodiversity recommendations"
requires-python = ">=3.10"

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
